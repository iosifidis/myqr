<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Inner QR Code Elements with glow -->
  <g filter="url(#glow)">
    <!-- Top-Left Finder Pattern -->
    <rect x="96" y="96" width="112" height="112" rx="24" fill="url(#qrGrad)" />
    <rect x="120" y="120" width="64" height="64" rx="12" fill="#4f46e5" />
    <rect x="136" y="136" width="32" height="32" rx="6" fill="url(#qrGrad)" />

    <!-- Top-Right Finder Pattern -->
    <rect x="304" y="96" width="112" height="112" rx="24" fill="url(#qrGrad)" />
    <rect x="328" y="120" width="64" height="64" rx="12" fill="#4f46e5" />
    <rect x="344" y="136" width="32" height="32" rx="6" fill="url(#qrGrad)" />

    <!-- Bottom-Left Finder Pattern -->
    <rect x="96" y="304" width="112" height="112" rx="24" fill="url(#qrGrad)" />
    <rect x="120" y="328" width="64" height="64" rx="12" fill="#4f46e5" />
    <rect x="136" y="344" width="32" height="32" rx="6" fill="url(#qrGrad)" />

    <!-- Data Blocks -->
    <rect x="232" y="96" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="232" y="160" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    
    <rect x="96" y="232" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="160" y="232" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="232" y="232" width="48" height="48" rx="10" fill="#ffffff" />
    <rect x="304" y="232" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="368" y="232" width="48" height="48" rx="10" fill="url(#qrGrad)" />

    <rect x="232" y="304" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="304" y="304" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="368" y="304" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="232" y="368" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="304" y="368" width="48" height="48" rx="10" fill="url(#qrGrad)" />
    <rect x="368" y="368" width="48" height="48" rx="10" fill="#22d3ee" />
  </g>
</svg>
